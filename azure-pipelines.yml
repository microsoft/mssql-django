# PR-validation pipeline for mssql-django (runs on Azure DevOps, not GitHub Actions).
#
# Windows_Core and Linux_Core cover Django 5.2, 6.0, and 6.1 on their supported
# Python versions. PR, CI, nightly, and manual runs use the same supported matrix.
#
# The per-leg build/test steps live in azure-pipelines-steps-windows.yml and
# azure-pipelines-steps-linux.yml.

trigger:
  - dev

pr:
  branches:
    include:
      - dev

schedules:
- cron: "0 21 * * *"
  displayName: Daily nightly build (2:30 AM IST)
  branches:
    include:
    - dev
  always: true

jobs:
  - job: Windows_Core
    displayName: Windows (supported Django)
    pool:
      name: Django-1ES-pool
      demands:
      - imageOverride -equals JDBC-MMS2025-SQL2025
    timeoutInMinutes: 120

    strategy:
      matrix:
        Python3.14 - Django 6.1:
          python.version: '3.14'
          tox.env: 'py314-django61'
        Python3.13 - Django 6.1:
          python.version: '3.13'
          tox.env: 'py313-django61'
        Python3.12 - Django 6.1:
          python.version: '3.12'
          tox.env: 'py312-django61'
        Python3.14 - Django 6.0:
          python.version: '3.14'
          tox.env: 'py314-django60'
        Python3.13 - Django 6.0:
          python.version: '3.13'
          tox.env: 'py313-django60'
        Python3.12 - Django 6.0:
          python.version: '3.12'
          tox.env: 'py312-django60'
        Python3.13 - Django 5.2:
          python.version: '3.13'
          tox.env: 'py313-django52'
        Python3.12 - Django 5.2:
          python.version: '3.12'
          tox.env: 'py312-django52'
        Python3.11 - Django 5.2:
          python.version: '3.11'
          tox.env: 'py311-django52'
        Python3.10 - Django 5.2:
          python.version: '3.10'
          tox.env: 'py310-django52'

    steps:
      - template: azure-pipelines-steps-windows.yml

  - job: Linux_Core
    displayName: Linux (supported Django)
    pool:
      name: Django-1ES-pool
      demands:
      - imageOverride -equals Ubuntu22.04-AzurePipelines
    timeoutInMinutes: 120

    strategy:
      matrix:
        Python3.14 - Django 6.1:
          python.version: '3.14'
          tox.env: 'py314-django61'
        Python3.13 - Django 6.1:
          python.version: '3.13'
          tox.env: 'py313-django61'
        Python3.12 - Django 6.1:
          python.version: '3.12'
          tox.env: 'py312-django61'
        Python3.14 - Django 6.0:
          python.version: '3.14'
          tox.env: 'py314-django60'
        Python3.13 - Django 6.0:
          python.version: '3.13'
          tox.env: 'py313-django60'
        Python3.12 - Django 6.0:
          python.version: '3.12'
          tox.env: 'py312-django60'
        Python3.13 - Django 5.2:
          python.version: '3.13'
          tox.env: 'py313-django52'
        Python3.12 - Django 5.2:
          python.version: '3.12'
          tox.env: 'py312-django52'
        Python3.11 - Django 5.2:
          python.version: '3.11'
          tox.env: 'py311-django52'
        Python3.10 - Django 5.2:
          python.version: '3.10'
          tox.env: 'py310-django52'

    steps:
      - template: azure-pipelines-steps-linux.yml
