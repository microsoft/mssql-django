# PR-validation pipeline for mssql-django (runs on Azure DevOps, not GitHub Actions).
#
# The matrix is split into two tiers so pull requests stay fast without losing coverage:
#   * Core jobs (Windows_Core / Linux_Core) run on every PR and CI build. They cover the
#     Django versions still supported upstream today: 5.2 (LTS), 6.0.
#   * Legacy jobs (Windows_Legacy / Linux_Legacy) cover end-of-life Django versions
#     (3.2, 4.0, 4.1, 4.2, 5.0, 5.1). These only run on the nightly schedule (or a manual
#     queue), so we keep full historical coverage without crowding every PR run.
#
# The per-leg build/test steps live in azure-pipelines-steps-windows.yml and
# azure-pipelines-steps-linux.yml so the Core and Legacy jobs share one definition.

trigger:
  - dev

pr:
  branches:
    include:
      - dev

schedules:
- cron: "0 21 * * *"
  displayName: Daily nightly build (2:30 AM IST)
  branches:
    include:
    - dev
  always: true

jobs:
  - job: Windows_Core
    displayName: Windows (supported Django)
    pool:
      name: Django-1ES-pool
      demands:
      - imageOverride -equals JDBC-MMS2025-SQL2025
    timeoutInMinutes: 120

    strategy:
      matrix:
        Python3.14 - Django 6.1:
          python.version: '3.14'
          tox.env: 'py314-django61'
        Python3.13 - Django 6.1:
          python.version: '3.13'
          tox.env: 'py313-django61'
        Python3.12 - Django 6.1:
          python.version: '3.12'
          tox.env: 'py312-django61'
        Python3.14 - Django 6.0:
          python.version: '3.14'
          tox.env: 'py314-django60'
        Python3.13 - Django 6.0:
          python.version: '3.13'
          tox.env: 'py313-django60'
        Python3.12 - Django 6.0:
          python.version: '3.12'
          tox.env: 'py312-django60'
        Python3.13 - Django 5.2:
          python.version: '3.13'
          tox.env: 'py313-django52'
        Python3.12 - Django 5.2:
          python.version: '3.12'
          tox.env: 'py312-django52'
        Python3.11 - Django 5.2:
          python.version: '3.11'
          tox.env: 'py311-django52'
        Python3.10 - Django 5.2:
          python.version: '3.10'
          tox.env: 'py310-django52'

    steps:
      - template: azure-pipelines-steps-windows.yml

  - job: Windows_Legacy
    displayName: Windows (EOL Django, nightly)
    # Gated off for the Windows-only mssql-python wheel validation (fixes #741/#742).
    # Restore to: or(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.Reason'], 'Manual'))
    condition: false
    pool:
      name: Django-1ES-pool
      demands:
      - imageOverride -equals JDBC-MMS2025-SQL2025
    timeoutInMinutes: 120

    strategy:
      matrix:
        Python3.13 - Django 5.1:
          python.version: '3.13'
          tox.env: 'py313-django51'
        Python3.12 - Django 5.1:
          python.version: '3.12'
          tox.env: 'py312-django51'
        Python3.11 - Django 5.1:
          python.version: '3.11'
          tox.env: 'py311-django51'
        Python3.10 - Django 5.1:
          python.version: '3.10'
          tox.env: 'py310-django51'
        Python3.12 - Django 5.0:
          python.version: '3.12'
          tox.env: 'py312-django50'
        Python3.11 - Django 5.0:
          python.version: '3.11'
          tox.env: 'py311-django50'
        Python3.10 - Django 5.0:
          python.version: '3.10'
          tox.env: 'py310-django50'
        Python3.11 - Django 4.2:
          python.version: '3.11'
          tox.env: 'py311-django42'
        Python3.10 - Django 4.2:
          python.version: '3.10'
          tox.env: 'py310-django42'
        Python 3.9 - Django 4.2:
          python.version: '3.9'
          tox.env: 'py39-django42'
        Python 3.8 - Django 4.2:
          python.version: '3.8'
          tox.env: 'py38-django42'
        Python3.11 - Django 4.1:
          python.version: '3.11'
          tox.env: 'py311-django41'
        Python3.10 - Django 4.1:
          python.version: '3.10'
          tox.env: 'py310-django41'
        Python 3.9 - Django 4.1:
          python.version: '3.9'
          tox.env: 'py39-django41'
        Python 3.8 - Django 4.1:
          python.version: '3.8'
          tox.env: 'py38-django41'
        Python3.11 - Django 4.0:
          python.version: '3.11'
          tox.env: 'py311-django40'
        Python3.10 - Django 4.0:
          python.version: '3.10'
          tox.env: 'py310-django40'
        Python 3.9 - Django 4.0:
          python.version: '3.9'
          tox.env: 'py39-django40'
        Python 3.8 - Django 4.0:
          python.version: '3.8'
          tox.env: 'py38-django40'
        Python3.11 - Django 3.2:
          python.version: '3.11'
          tox.env: 'py311-django32'
        Python 3.9 - Django 3.2:
          python.version: '3.9'
          tox.env: 'py39-django32'
        Python 3.8 - Django 3.2:
          python.version: '3.8'
          tox.env: 'py38-django32'

    steps:
      - template: azure-pipelines-steps-windows.yml

  - job: Linux_Core
    displayName: Linux (supported Django)
    # Gated off for the Windows-only validation: build 172271 produced no Linux
    # wheels, so Linux legs would still run against the unfixed PyPI driver.
    condition: false
    pool:
      name: Django-1ES-pool
      demands:
      - imageOverride -equals Ubuntu22.04-AzurePipelines
    timeoutInMinutes: 120

    strategy:
      matrix:
        Python3.14 - Django 6.1:
