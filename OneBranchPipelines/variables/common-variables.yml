# Common variables shared across the mssql-django release pipelines
# (build-release-package, official-release, dummy-release).
# mssql-django is a pure-Python package, so there is no native/ODBC/symbol
# machinery here — only the paths, package identity, and the regex_clr.dll
# source coordinates.
variables:
  # Repository root
  - name: REPO_ROOT
    value: $(Build.SourcesDirectory)
    readonly: true

  # Artifact staging path
  - name: ARTIFACT_PATH
    value: $(Build.ArtifactStagingDirectory)
    readonly: true

  # Package identity
  - name: PACKAGE_NAME
    value: 'mssql-django'
    readonly: true

  # Azure Artifacts feed used for pip authentication during build
  - name: PIP_FEED
    value: 'mssql-django/mssql-django_PublicPackages'
    readonly: true

  # regex_clr.dll (SQL CLR assembly backing REGEXP_LIKE) is NOT stored in the
  # repo (FCIB policy) nor a storage account. It is an Azure DevOps Secure File
  # named 'regex_clr.dll', pulled at build time via DownloadSecureFile@1 and
  # checksum-verified in build-release-package-pipeline.yml.
