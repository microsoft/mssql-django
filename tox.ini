[tox]
envlist =
       {py36,py37,py38,py39}-django32,
       {py38, py39, py310}-django40,
       {py38, py39, py310}-django41,
       {py38, py39, py310}-django42,
       {py310, py311, py312}-django50
       {py310, py311, py312, py313}-django51
       {py310, py311, py312, py313}-django52
       {py312, py313, py314}-django60
       {py312, py313, py314}-django61

[testenv]
allowlist_externals =
    bash
passenv =
    MSSQL_*

setenv =
    # Exercise the opt-in mssql-python driver on the Python versions it
    # supports (3.10+); other envs keep the default pyodbc path. Driver 18 is
    # bundled and defaults to mandatory encryption, so trust the CI server's
    # self-signed certificate.
    py310,py311,py312,py313,py314: MSSQL_PYTHON_DRIVER=mssql_python
    py310,py311,py312,py313,py314: MSSQL_EXTRA_PARAMS=TrustServerCertificate=yes

commands =
    coverage run --parallel-mode manage.py test --noinput
    bash test.sh

deps =
    coverage==5.5
    unittest-xml-reporting

    # mssql-python requires Python 3.10+; installed only for those envs so the
    # legacy (py36-py39) envs continue to run under pyodbc unchanged.
    py310,py311,py312,py313,py314: mssql-python>=1.15.0

    django32: django==3.2.*
    django40: django>=4.0a1,<4.1
    django41: django>=4.1a1,<4.2
    django42: django>=4.2,<4.3
    django50: django>=5.0,<5.1
    django51: django>=5.1,<5.2
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
