name: Copilot Code Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

permissions: {}

jobs:
  # GitHub requires this job name for Copilot code review setup.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MyPassword42"
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install ODBC Driver 18
        run: |
          set -euo pipefail
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Configure review environment
        run: |
          {
            echo "MSSQL_PASSWORD=MyPassword42"
            echo "MSSQL_HOST=127.0.0.1"
            echo "MSSQL_DRIVER=ODBC Driver 18 for SQL Server"
            echo "MSSQL_EXTRA_PARAMS=TrustServerCertificate=yes"
          } >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[test]"

      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if python - <<'PY'
          import os
          import pyodbc

          try:
              connection = pyodbc.connect(
                  f"DRIVER={{{os.environ['MSSQL_DRIVER']}}};"
                  f"SERVER={os.environ['MSSQL_HOST']},1433;"
                  f"UID=sa;PWD={os.environ['MSSQL_PASSWORD']};"
                  f"DATABASE=master;{os.environ['MSSQL_EXTRA_PARAMS']}",
                  timeout=5,
              )
              connection.close()
          except pyodbc.Error as error:
              print(error)
              raise SystemExit(1)
          PY
            then
              echo "SQL Server is ready."
              exit 0
            fi
            echo "SQL Server is not ready (attempt $i/30)."
            sleep 5
          done
          echo "SQL Server did not become ready in time."
          exit 1
