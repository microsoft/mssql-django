# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

# This workflow is triggered on pushes to the dev branch, pull requests targeting
permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [ dev ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ dev ]
  schedule:
    - cron: '40 13 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        upload: never
        upload-database: false

    - name: Break build on CodeQL findings
      env:
        SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
      shell: bash
      run: |
        python - "$SARIF_OUTPUT" <<'PY'
        import json
        import sys
        from collections import Counter
        from pathlib import Path

        sarif_files = list(Path(sys.argv[1]).rglob("*.sarif"))
        if not sarif_files:
            print("::error::CodeQL did not produce SARIF output.")
            raise SystemExit(1)

        levels = Counter()
        for sarif_file in sarif_files:
            with sarif_file.open(encoding="utf-8") as stream:
                for run in json.load(stream).get("runs", []):
                    levels.update(
                        result.get("level", "warning")
                        for result in run.get("results", [])
                    )

        blocking_findings = levels["error"] + levels["warning"]
        if blocking_findings:
            print(
                f"::error::CodeQL reported {blocking_findings} blocking "
                "finding(s). Review the uploaded GitHub code-scanning alerts."
            )
            raise SystemExit(1)

        print(f"CodeQL found no blocking findings ({levels['note']} note(s)).")
        PY
